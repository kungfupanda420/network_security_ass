<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Network Defense{% endblock %}</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #0d1117; color: #c9d1d9; margin: 0; display: flex; }
        
        /* Sidebar Navigation */
        .sidebar { width: 220px; background-color: #161b22; height: 100vh; padding: 20px; border-right: 1px solid #30363d; position: fixed; }
        .sidebar h2 { color: #58a6ff; text-align: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; margin-top: 0; }
        .sidebar a { display: block; color: #c9d1d9; text-decoration: none; padding: 12px; margin-bottom: 8px; border-radius: 5px; transition: 0.2s; }
        .sidebar a:hover, .sidebar a.active { background-color: #21262d; color: #58a6ff; }
        
        /* Main Content Area */
        .main-content { margin-left: 260px; padding: 30px; width: calc(100% - 320px); }
        h1 { color: #c9d1d9; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-top: 0; }
        
        /* Cards & Grids */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; text-align: center; }
        .card h3 { margin: 0 0 10px 0; font-size: 13px; color: #8b949e; text-transform: uppercase; }
        .card p { margin: 0; font-size: 32px; font-weight: bold; color: #2ea043; }
        .card.alert p { color: #f85149; }
        .card.warning p { color: #f2cc60; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; background-color: #161b22; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #30363d; }
        th { background-color: #21262d; color: #8b949e; text-transform: uppercase; font-size: 13px; }
        tr:hover { background-color: #21262d; }
        
        /* Risk Badges */
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge.LOW { background-color: rgba(210, 168, 255, 0.1); color: #d2a8ff; border: 1px solid #d2a8ff; }
        .badge.MEDIUM { background-color: rgba(242, 204, 96, 0.1); color: #f2cc60; border: 1px solid #f2cc60; }
        .badge.HIGH { background-color: rgba(248, 81, 73, 0.1); color: #f85149; border: 1px solid #f85149; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>IDS Dashboard</h2>
        <a href="/" class="{% if request.path == '/' %}active{% endif %}">Overview</a>
        <a href="/events" class="{% if request.path == '/events' %}active{% endif %}">Live Events</a>
        <a href="/attackers" class="{% if request.path == '/attackers' %}active{% endif %}">Threat Intel (IPs)</a>
        <a href="/honeypot" class="{% if request.path == '/honeypot' %}active{% endif %}">Honeypot Traps</a>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
